name = "cf-sub-worker"
main = "dist/_worker.js"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# TCP 出口固定在美国西部附近，提升国际路由吞吐
[placement]
region = "aws:us-west-2"

# 定时触发器：每 30 分钟执行一次优选 IP 轮转与出口 IP 健康检查
[triggers]
crons = ["*/30 * * * *"]

[vars]
# 自定义域名：如 sub.yourdomain.com，主域名需托管在本账号；留空则使用免费 workers.dev 域名
DOMAIN = ""

# 管理员登录邮箱：首次登录后台时使用（默认 admin@example.com）
ADMIN_EMAIL = "admin@example.com"

# 客户端节点标识前缀
SUB_TITLE = "Preferred-IP 三网实测节点"

# 备用中继出口 IP：遇到 Cloudflare Error 1000 时的备用出口，绝大多数网站走原生直连，默认留空
PROXYIP = ""

# 边缘缓存时间（秒）：有效节省每日 Workers 请求额度
CACHE_TTL = "300"

# 访问安全策略：严格用户隔离，关闭公共免密访问
ALLOW_PUBLIC_SUB = "0"
ALLOW_STATELESS_TOKENS = "1"
ALLOW_LEGACY_WS = "1"
ALLOW_REGION_DIRECT_FALLBACK = "1"
DEFAULT_REGION = "DIRECT"
PROFILE_UPDATE_INTERVAL_HOURS = "12"

# Preferred-IP 自动优选
OPTIMIZER_ENABLED = "1"
OPTIMIZER_BATCH = "4"
OPTIMIZER_TOP_N = "20"
CANDIDATES_PER_CIDR = "4"
PROBE_PACKETS = "4"

# Globalping：中国移动 / 联通 / 电信探针
GLOBALPING_ENABLED = "1"
GP_CM_MAGIC = "China Mobile Communications"
GP_CU_MAGIC = "CHINA UNICOM China169 Backbone"
GP_CT_MAGIC = "China Telecom"

[observability]
enabled = true
head_sampling_rate = 0.1

# KV 命名空间绑定（构建时会自动关联或安全降级）
# [[kv_namespaces]]
# binding = "XS_SUB_KV"
# 提示：可在 Cloudflare 控制台 Worker -> Settings -> Bindings 中手动添加名为 XS_SUB_KV 的绑定
